<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    canvas { border: 2px solid #222; background: #eee; max-width: 90vw; }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <p>Use the arrow keys to play. Eat the red square!</p>
  <p id="score">Score: 0</p>
  <canvas id="game" width="400" height="400"></canvas>
  <p><button onclick="startGame()">Start / Restart</button></p>
  <p><a href="index.html">Back to game menu</a></p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const size = 20;
    let snake, food, dx, dy, score, timer;

    function startGame() {
      clearInterval(timer);
      snake = [{ x: 200, y: 200 }];
      food = { x: 100, y: 100 };
      dx = size; dy = 0; score = 0;
      document.getElementById("score").textContent = "Score: 0";
      timer = setInterval(step, 120);
      draw();
    }

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: [0, -size], ArrowDown: [0, size],
        ArrowLeft: [-size, 0], ArrowRight: [size, 0]
      };
      if (!keys[event.key]) return;
      event.preventDefault();
      const [newDx, newDy] = keys[event.key];
      if (newDx !== -dx || newDy !== -dy) { dx = newDx; dy = newDy; }
    });

    function step() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 ||
          head.y >= canvas.height ||
          snake.some(part => part.x === head.x && part.y === head.y)) {
        clearInterval(timer);
        alert("Game over! Score: " + score);
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = "Score: " + score;
        food = {
          x: Math.floor(Math.random() * (canvas.width / size)) * size,
          y: Math.floor(Math.random() * (canvas.height / size)) * size
        };
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, size, size);
      ctx.fillStyle = "green";
      snake.forEach(part => ctx.fillRect(part.x, part.y, size, size));
    }

    startGame();
  </script>
</body>
</html>
